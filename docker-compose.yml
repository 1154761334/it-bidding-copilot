services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: it-bidding-pgvector
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: bidcore_password123
      POSTGRES_DB: bidcore_enterprise
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    command: postgres -c 'max_connections=200'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d bidcore_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
